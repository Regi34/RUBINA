name: 01 - Scriptwriter Agent

on:
  schedule:
    # Otomatis buat 1 ide script setiap hari jam 07:00 WIB (00:00 UTC)
    - cron: "0 0 * * *"
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      theme:
        description: "Tema edukasi & motorik anak (3-5 tahun)"
        required: false
        default: "random"
        type: choice
        options:
          - random
          - motorik_hewan
          - warna_dan_gerak
          - angka_dan_jari
          - bentuk_di_udara
          - kebiasaan_baik
          - alam_dan_cuaca
      custom_topic:
        description: "Topik khusus (opsional, mis: Lompat Seperti Katak)"
        required: false
        default: ""
        type: string
      privacy_status:
        description: "Status privasi saat upload YouTube"
        required: false
        default: "private"
        type: choice
        options:
          - private
          - unlisted
          - public

permissions:
  contents: write
  issues: write

jobs:
  generate-script:
    if: github.event_name != 'issues' || github.event.label.name == 'revise'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Scriptwriter & Safety Guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OFFICE_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          INPUT_THEME: ${{ github.event.inputs.theme || 'random' }}
          INPUT_TOPIC: ${{ github.event.inputs.custom_topic || '' }}
          INPUT_PRIVACY: ${{ github.event.inputs.privacy_status || 'private' }}
          REVISION_ISSUE_NUMBER: ${{ github.event_name == 'issues' && github.event.issue.number || '' }}
        run: python -m agents.pipeline_script

      - name: Commit updated office state
        run: |
          git config user.name "virtual-office-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/office_state.json state/history.json
          if ! git diff --staged --quiet; then
            git pull --rebase
            git commit -m "chore: update office state after scripting"
            git push
          fi
